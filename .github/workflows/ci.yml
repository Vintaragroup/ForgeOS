name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Plain postgres:16-alpine doesn't ship the pgvector extension --
        # migration 20260901185550_add_document_chunks's own `CREATE
        # EXTENSION IF NOT EXISTS vector` (needed for DocumentChunk's
        # vector(1536) column, chat/embeddings) fails on it with "extension
        # \"vector\" is not available", failing every single CI run since
        # that migration was added regardless of what the actual push
        # changed. pgvector/pgvector:pg16 is the official pgvector project's
        # own image, built on top of postgres:16 with the extension already
        # compiled in -- same Postgres 16, just with the extension present.
        # Local dev/test Postgres and Render production both already have
        # pgvector, which is why this only ever showed up in CI.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: forgeos
          POSTGRES_PASSWORD: forgeos
          POSTGRES_DB: forgeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeos -d forgeos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://forgeos:forgeos@localhost:5432/forgeos_test?schema=public
      SESSION_SECRET: ci-only-secret-not-used-for-anything-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Typecheck & build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Non-blocking for now -- this repo has known moderate/high
      # advisories in transitive dependencies that haven't been triaged
      # yet. Reporting them on every run without failing the build lets
      # them stay visible without blocking unrelated PRs; tighten to
      # blocking once they're addressed.
      - name: Dependency audit (report only)
        run: npm audit --audit-level=high
        continue-on-error: true

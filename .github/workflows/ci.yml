name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: web

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forgeos
          POSTGRES_PASSWORD: forgeos
          POSTGRES_DB: forgeos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeos -d forgeos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://forgeos:forgeos@localhost:5432/forgeos_test?schema=public
      SESSION_SECRET: ci-only-secret-not-used-for-anything-real

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy

      - name: Typecheck & build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
